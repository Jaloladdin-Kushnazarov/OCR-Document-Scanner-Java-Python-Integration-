spring.application.name=PassportOCR

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Python OCR — EasyOCR GPU bo'lmasa 60-90s ketishi mumkin
ocr.python.base-url=http://localhost:8000
ocr.python.connect-timeout=5s
ocr.python.read-timeout=120s
ocr.python.response-timeout=120s
ocr.python.max-concurrency=2

# Spring MVC async timeout (controller)
spring.mvc.async.request-timeout=120000